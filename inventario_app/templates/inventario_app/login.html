<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - CNC Soluciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            max-width: 420px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .login-header {
            background: linear-gradient(135deg, #DC3545 0%, #C82333 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        .login-header h2 {
            font-weight: bold;
            margin-bottom: 10px;
        }
        .login-header p {
            margin-bottom: 0;
            opacity: 0.9;
        }
        .login-body {
            padding: 40px;
            background: white;
        }
        .form-control:focus {
            border-color: #DC3545;
            box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.25);
        }
        .btn-login {
            background: linear-gradient(135deg, #DC3545 0%, #C82333 100%);
            border: none;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #C82333 0%, #a71d2a 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.3);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <h2>🔧 CNC Stock</h2>
            <p>Sistema de Inventario</p>
        </div>
        <div class="login-body">
            <form method="post">
                {% csrf_token %}
                
                <div class="mb-4">
                    <label for="id_username" class="form-label fw-bold">
                        <i class="bi bi-person-circle"></i> Usuario
                    </label>
                    <input type="text" name="username" id="id_username" class="form-control form-control-lg" required autofocus>
                </div>
                
                <div class="mb-4">
                    <label for="id_password" class="form-label fw-bold">
                        <i class="bi bi-lock"></i> Contraseña
                    </label>
                    <input type="password" name="password" id="id_password" class="form-control form-control-lg" required>
                </div>
                
                {% if form.errors %}
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle"></i> Usuario o contraseña incorrectos
                    </div>
                {% endif %}
                
                <button type="submit" class="btn btn-login btn-lg w-100 text-white">
                    <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
                </button>
            </form>
            
            <div class="text-center mt-4">
                <small class="text-muted">CNC Soluciones © 2026</small>
            </div>
        </div>
    </div>
</body>
</html>
